[project]
name = "vaakdb-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["app/ai", "migrations/env.py", "migrations/versions/da0e92c7b42f_create_users_and_projects_tables.py", "app/db/session.py", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "B008", "RUF001", "RUF012", "UP040", "UP007", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "RUF"]
"app/ai/dbops/**" = []
"scripts/**" = ["T201", "S"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
explicit_package_bases = true
namespace_packages = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]
exclude = ['^app/ai/(?!dbops/)', '^migrations/', '^tests/', '^[.]venv/']

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[[tool.mypy.overrides]]
module = ["app.ai.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["app.ai.dbops.*"]
ignore_errors = false
